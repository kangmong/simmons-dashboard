<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIMMONS | 해외 매트리스 업계 동향</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <!-- SIMMONS 통합 헤더 (기존 검은 상단 바 + 히어로 배너를 한 겹으로 합침) -->
  <header class="app-header" aria-label="SIMMONS Factorium">
    <div class="hdr-lockup">
      <div class="hdr-logo">
        <span class="hdr-mark">SIMMONS</span>
        <span class="hdr-factorium">FACTORIUM</span>
      </div>
      <span class="hdr-rule"></span>
      <p class="hdr-sub">국내외 매트리스 업계 동향</p>
    </div>

    <div class="header-right">
      <button class="report-btn" id="reportBtn" type="button" title="현재 화면을 PDF로 저장">
        ⭳ 보고서 다운로드
      </button>
    </div>

    <!-- 건물 일러스트 (기존 히어로의 SVG 그대로) -->
    <svg class="hdr-art" viewBox="0 0 360 200" fill="none" aria-hidden="true">
      <!-- 하늘/해 -->
      <circle cx="308" cy="44" r="30" fill="var(--accent-soft)" />
      <circle cx="308" cy="44" r="30" stroke="var(--accent)" stroke-opacity=".25" stroke-width="1.5" />
      <!-- 지면 -->
      <line x1="8" y1="170" x2="352" y2="170" stroke="var(--line)" stroke-width="2" />
      <!-- 소나무 (팩토리움 숲) -->
      <g stroke="var(--slate)" stroke-width="1.5" stroke-linejoin="round">
        <polygon points="300,96 286,120 314,120" fill="var(--slate-soft)" />
        <polygon points="300,112 282,140 318,140" fill="var(--slate-soft)" />
        <polygon points="300,128 278,162 322,162" fill="var(--slate-soft)" />
        <rect x="296" y="162" width="8" height="8" fill="var(--slate)" stroke="none" />
      </g>
      <g stroke="var(--slate)" stroke-width="1.5" stroke-linejoin="round">
        <polygon points="336,120 326,138 346,138" fill="var(--slate-soft)" />
        <polygon points="336,132 320,158 352,158" fill="var(--slate-soft)" />
        <rect x="332" y="158" width="8" height="12" fill="var(--slate)" stroke="none" />
      </g>
      <!-- 낮은 본관 (유리 파사드) -->
      <rect x="36" y="100" width="176" height="70" rx="4" fill="var(--card)" stroke="var(--slate)" stroke-width="2" />
      <rect x="32" y="93" width="184" height="9" rx="2" fill="var(--slate)" />
      <g stroke="var(--line)" stroke-width="1.5">
        <line x1="60" y1="104" x2="60" y2="169" /><line x1="84" y1="104" x2="84" y2="169" />
        <line x1="108" y1="104" x2="108" y2="169" /><line x1="156" y1="104" x2="156" y2="169" />
        <line x1="180" y1="104" x2="180" y2="169" /><line x1="36" y1="136" x2="212" y2="136" />
      </g>
      <!-- 정문 -->
      <rect x="120" y="140" width="24" height="30" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
      <!-- 타워동 (크림슨 캡) -->
      <rect x="206" y="70" width="48" height="100" rx="4" fill="var(--ink)" />
      <rect x="206" y="70" width="48" height="15" rx="4" fill="var(--accent)" />
      <g fill="var(--card)" fill-opacity=".85">
        <rect x="214" y="96" width="14" height="11" rx="1" /><rect x="232" y="96" width="14" height="11" rx="1" />
        <rect x="214" y="116" width="14" height="11" rx="1" /><rect x="232" y="116" width="14" height="11" rx="1" />
        <rect x="214" y="136" width="14" height="11" rx="1" /><rect x="232" y="136" width="14" height="11" rx="1" />
      </g>
    </svg>
  </header>

  <div class="layout">
    <!-- 좌측 네비게이션 + 상시 업로드 위젯 -->
    <nav class="tabs" id="tabs">
      <button class="nav-item is-active" data-view="dashboard">
        <span class="tab-num tab-num--home">⌂</span>대시보드
      </button>
      <button class="nav-item" data-view="simmons_news">
        <span class="tab-num">2</span>시몬스 코리아 소식
      </button>
      <button class="nav-item" data-view="material">
        <span class="tab-num">3</span>원자재 원가 동향
      </button>
      <button class="nav-item" data-view="competitor">
        <span class="tab-num">4</span>국내외 경쟁사 분기 실적
      </button>
      <button class="nav-item" data-view="domestic">
        <span class="tab-num">5</span>국내외 경쟁사 신제품·브랜드 동향
      </button>
      <button class="nav-item" data-view="fx">
        <span class="tab-num">6</span>환율
      </button>
      <button class="nav-item" data-view="worldclock">
        <span class="tab-num">7</span>세계 시간
      </button>

      <div class="sidebar-fill"></div>

      <!-- 상시 실시간 업데이트 위젯 (어느 화면에서든 항상 표시) -->
      <div class="upload-widget" id="uploadWidget">
        <div class="uw-title">데이터 업데이트</div>
        <div class="uw-actions">
          <button class="uw-update" id="updateBtn" type="button">업데이트</button>
          <button class="uw-reset" id="clearBtn" type="button" title="화면 값을 초기 상태로 되돌립니다">초기화</button>
        </div>
        <div class="uw-updated" id="lastUpdated">아직 업데이트하지 않았습니다</div>
        <div class="uw-note">World Bank 핑크시트 · 월간 원자재 가격</div>
      </div>
    </nav>

    <!-- 컨텐츠: 대시보드(그리드) ↔ 개별 섹션(포커스) -->
    <main class="content" id="content" data-view="dashboard">
      <button class="focus-back" id="focusBack" type="button">‹ 대시보드로</button>

      <div class="dash-header" id="dashHeader">
        <div class="dash-title">
          <h2>Global Mattress Industry Intelligence Dashboard</h2>
          <p>해외 시장·경쟁사·업계 뉴스·원자재 원가를 한눈에</p>
        </div>
        <div class="dash-meta">
          <span class="dash-ctl">마지막 업데이트 <b id="dashUpdated">—</b></span>
        </div>
      </div>

      <div class="dash-grid" id="dashGrid">
        <section class="dash-card" data-section="simmons_news">
          <div class="dash-card__head">
            <h3 class="dash-card__title sk-title">
              <span class="sk-logo-box">
                <img class="sk-logo" src="logo.svg" alt="SIMMONS"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
                <span class="sk-logo-wm" style="display:none">SIMMONS</span>
              </span>
              시몬스 코리아 소식
            </h3>
            <button class="more-link" data-view="simmons_news" type="button">더보기 ›</button>
          </div>
          <div class="panel-body" id="body-simmons_news">
            <div class="sk-subhead">
              <span class="sk-sub">팝업·행사·신제품 소식</span>
              <span class="comp-caption sk-src">출처: Google News</span>
            </div>
            <div class="sk-grid" id="simmonsNewsGrid"></div>
          </div>
        </section>

        <section class="dash-card" data-section="material">
          <div class="dash-card__head">
            <h3 class="dash-card__title">원자재 · 원가 동향</h3>
            <button class="more-link" data-view="material" type="button">더보기 ›</button>
          </div>
          <div class="panel-body" id="body-material">
            <div id="materialRoot"></div>
          </div>
        </section>

        <section class="dash-card" data-section="competitor">
          <div class="dash-card__head">
            <h3 class="dash-card__title">국내외 경쟁사 분기 실적</h3>
            <button class="more-link" data-view="competitor" type="button">더보기 ›</button>
          </div>
          <div class="panel-body" id="body-competitor">
            <div id="compRoot"></div>
          </div>
        </section>

        <section class="dash-card" data-section="domestic">
          <div class="dash-card__head">
            <h3 class="dash-card__title">국내외 경쟁사 신제품·브랜드 동향</h3>
            <button class="more-link" data-view="domestic" type="button">더보기 ›</button>
          </div>
          <div class="panel-body" id="body-domestic">
            <div class="dom-list" id="domesticList"></div>
          </div>
        </section>

        <section class="dash-card" data-section="fx">
          <div class="dash-card__head">
            <h3 class="dash-card__title">환율 (원화 시세)</h3>
            <button class="more-link" data-view="fx" type="button">더보기 ›</button>
          </div>
          <div class="panel-body" id="body-fx"></div>
        </section>

        <section class="dash-card" data-section="worldclock">
          <div class="dash-card__head">
            <h3 class="dash-card__title">세계 시간</h3>
            <button class="more-link" data-view="worldclock" type="button">더보기 ›</button>
          </div>
          <div class="panel-body" id="body-worldclock">
            <div id="worldclockRoot"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
