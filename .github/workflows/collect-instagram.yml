name: SIMMONS IG 수집 (하루 2회)

# Apify Instagram Scraper 로 @simmonskorea 최신 게시물을 받아
# public/data/instagram.json 으로 커밋한다. 화면은 이 파일만 읽는다(Apify 호출 0회).
#
# ★ Vercel Cron 이 아니라 여기서 도는 이유: Vercel 서버리스는 파일시스템이 읽기 전용이라
#   캐시 파일을 남길 수 없다. 저장소에 커밋해 두는 이 방식이 실제로 '남는' 캐시다.
#   (collect.yml · collect-koima-price.yml 과 같은 구조)
on:
  schedule:
    - cron: '0 0 * * *'      # UTC 00:00 = KST 09:00
    - cron: '0 9 * * *'      # UTC 09:00 = KST 18:00
  workflow_dispatch:

permissions:
  contents: write            # 결과 JSON 커밋용

concurrency:
  group: collect-instagram
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 토큰이 없으면 status=no_key 로 조용히 끝난다(빌드가 깨지지 않는다).
      # 최신 게시물 id 가 캐시와 같으면 파일을 다시 쓰지 않는다 → 아래 커밋 단계도 건너뛴다.
      - name: Instagram 게시물 수집
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'simmonskorea' }}
        run: python api/instagram.py

      - name: 변경 있을 때만 커밋·푸시
        if: always()
        run: |
          if git diff --quiet -- public/data/instagram.json; then
            echo "새 게시물 없음 → 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/instagram.json
          git commit -m "자동 수집: SIMMONS IG 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
          git push

      - name: 결과 요약
        if: always()
        run: |
          python - <<'PY'
          import io, json, os
          p = "public/data/instagram.json"
          if not os.path.isfile(p):
              print("::warning::instagram.json 이 없습니다"); raise SystemExit(0)
          d = json.load(io.open(p, encoding="utf-8"))
          items = d.get("items", [])
          txt = ["## %s SIMMONS IG" % ("✅" if items else "⚠️"), "",
                 "- 계정: `@%s`" % d.get("username", "?"),
                 "- 게시물 %d건 · 수집 %s" % (len(items), d.get("fetched_at", "—"))]
          txt += ["- `%s` %s — %s" % (i.get("date") or "날짜없음", i.get("id"), i.get("caption") or "(캡션 없음)")
                  for i in items]
          if not items:
              print("::warning::게시물 0건 (%s)" % d.get("reason", ""))
          print("\n".join(txt))
          s = os.environ.get("GITHUB_STEP_SUMMARY")
          if s:
              io.open(s, "a", encoding="utf-8").write("\n".join(txt) + "\n")
          PY
