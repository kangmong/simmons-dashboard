name: 대시보드 데이터 사전 수집

# 새벽에 미리 수집해 public/data/dashboard.json 으로 커밋한다.
# 그러면 대시보드의 [업데이트] 버튼은 이 파일만 읽어 즉시 완료된다.
on:
  schedule:
    - cron: '0 20 * * *'      # UTC 20:00 = KST 05:00 (매일)
  workflow_dispatch:
    inputs:
      force:
        description: '캐시를 무시하고 전부 새로 수집'
        type: boolean
        default: false

permissions:
  contents: write              # 결과 JSON 커밋용

concurrency:
  group: collect-dashboard
  cancel-in-progress: false

env:
  # 허용 실패 수. 0 = 수집기 하나라도 실패하면 job 을 실패로 표시(기본 이메일 알림).
  # 일시적 실패로 알림이 잦으면 1~2 로 올릴 것.
  ALLOWED_FAILURES: '0'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 개별 수집기가 실패해도 나머지는 저장된다(collect_all.py 가 부분 실패를 허용).
      # 전 수집기 실패 시에만 0이 아닌 코드로 끝나며, 그때는 기존 파일을 덮어쓰지 않는다.
      - name: 데이터 수집
        env:
          # 예측 카드의 '해설 문장' 생성용. 시크릿이 없으면 빈 값이 들어가고,
          # 각 예측 모듈이 통계 예측값만 표시하는 기존 폴백으로 동작한다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collect_all.py ${{ inputs.force && '--force' || '' }}

      # ★ 실패 판정보다 '먼저' 커밋한다 — 일부 수집기가 실패해도 성공분은 반영되고
      #   롤백되지 않는다.
      - name: 변경 있을 때만 커밋·푸시
        if: always()
        run: |
          if git diff --quiet -- public/data/dashboard.json; then
            echo "내용 변경 없음 → 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard.json
          git commit -m "자동 수집: 대시보드 데이터 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
          git push

      # 커밋이 끝난 뒤 결과를 판정한다. 실패가 허용치를 넘으면 job 을 실패로 표시해
      # GitHub 기본 알림(저장소 소유자 이메일)이 발송되게 한다.
      - name: 수집 결과 판정 · 실패 시 알림
        if: always()
        run: python collect_all.py --report
