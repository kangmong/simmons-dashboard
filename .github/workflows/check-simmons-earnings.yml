name: 실적 뉴스 알림 (무료)

# Google 뉴스 RSS 로 새 연도 실적 기사가 떴는지만 확인해 Issue 를 연다.
# ★ API 키·결제 없음. 데이터 파일은 이 자동화가 고치지 않는다 — 사람이 손으로 반영한다.
#
# 국내 실적 발표는 3월~4월 중순에 몰린다. 그 기간만 매일 돌린다.
# cron 은 "3월 1일~4월 15일" 을 한 줄로 못 쓰므로 두 줄로 나눈다.
#   06:00 UTC = 15:00 KST
# ★ cron 은 월·일만 거르므로, 시즌을 벗어난 실행은 첫 스텝에서 즉시 skip 한다.
on:
  schedule:
    - cron: '0 6 * 3 *'       # 3월 1~31일 매일
    - cron: '0 6 1-15 4 *'    # 4월 1~15일 매일
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Issue 를 만들지 않고 결과만 확인'
        type: boolean
        default: false
      force:
        description: '시즌(3/1~4/15) 밖에서도 실행'
        type: boolean
        default: false

# Issue 생성 + seen 파일 커밋에 필요한 최소 권한. 기본 GITHUB_TOKEN 으로 충분하다.
permissions:
  contents: write
  issues: write

concurrency:
  group: simmons-news-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      # ── 0) 시즌 밖이면 즉시 종료 (3월 1일 ~ 4월 15일만 통과)
      - name: 실행 시즌 확인
        id: season
        run: |
          set -euo pipefail
          MM=$(date -u +%m); DD=$(date -u +%d)
          IN=false
          if [ "$MM" = "03" ]; then IN=true; fi
          if [ "$MM" = "04" ] && [ "$((10#$DD))" -le 15 ]; then IN=true; fi
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force 입력 — 시즌 검사를 건너뛴다"; IN=true
          fi
          echo "in_season=$IN" >> "$GITHUB_OUTPUT"
          if [ "$IN" != "true" ]; then
            echo "::notice::실적 발표 시즌(3/1~4/15)이 아니라 종료합니다. 오늘 UTC $MM-$DD"
          fi

      - uses: actions/checkout@v4
        if: steps.season.outputs.in_season == 'true'

      - uses: actions/setup-node@v4
        if: steps.season.outputs.in_season == 'true'
        with:
          node-version: '20'    # 내장 https 만 쓴다 — 의존성 설치 없음

      - name: 뉴스 확인 및 Issue 생성
        id: check
        if: steps.season.outputs.in_season == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/check-news-alert.js ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      # ── 알림을 보낸 링크 목록을 커밋해 다음 실행에서 중복 알림을 막는다
      - name: 알림 기록 커밋
        if: steps.check.outputs.found == 'true'
        env:
          YEAR: ${{ steps.check.outputs.year }}
          COUNT: ${{ steps.check.outputs.count }}
          ISSUE: ${{ steps.check.outputs.issue_url }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/.seen-news-urls.json
          if git diff --cached --quiet; then
            echo "기록 변경 없음"
            exit 0
          fi
          git commit \
            -m "실적 뉴스 알림 기록: ${YEAR}년 기사 ${COUNT}건" \
            -m "중복 알림 방지용 링크 목록만 갱신한다. 실적 데이터는 사람이 손으로 반영한다." \
            -m "Issue: ${ISSUE}" \
            -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push
          {
            echo "### ${YEAR}년 실적 기사 ${COUNT}건 발견"
            echo ""
            echo "- Issue: ${ISSUE}"
            echo "- 데이터 반영은 **수동**입니다. Issue 의 체크리스트를 따라 주세요."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 알림 없음
        if: steps.season.outputs.in_season == 'true' && steps.check.outputs.found != 'true'
        run: echo "::notice::새 기사가 없습니다. 내일 다시 확인합니다."
