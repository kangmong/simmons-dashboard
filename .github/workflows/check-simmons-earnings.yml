name: 시몬스 새 연도 실적 감지

# 국내 실적 발표는 3월~4월 중순에 몰린다. 그 기간만 매일 돌린다.
# cron 은 "3월 1일~4월 15일" 을 한 줄로 못 쓰므로 두 줄로 나눈다.
#   06:00 UTC = 15:00 KST
on:
  schedule:
    - cron: '0 6 * 3 *'       # 3월 1~31일 매일
    - cron: '0 6 1-15 4 *'    # 4월 1~15일 매일
  workflow_dispatch:          # 수동 실행(테스트용)
    inputs:
      dry_run:
        description: '파일을 쓰지 않고 결과만 확인'
        type: boolean
        default: false

# 자동 merge 는 하지 않는다. PR 만 연다.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: simmons-earnings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'      # 전역 fetch 사용 — 의존성 설치 없음

      - name: 실적 검색 및 JSON 갱신
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 모델을 바꾸려면 저장소 Variables 에 EARNINGS_MODEL 을 넣으면 된다
          EARNINGS_MODEL: ${{ vars.EARNINGS_MODEL }}
        run: |
          node scripts/check-earnings.js ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: PR 생성
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YEAR: ${{ steps.check.outputs.year }}
          PROV: ${{ steps.check.outputs.provisional }}
          BODY: ${{ steps.check.outputs.body_path }}
        run: |
          set -euo pipefail
          BRANCH="earnings/${YEAR}-$(date -u +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 같은 브랜치가 이미 있으면(같은 날 재실행) 아무것도 하지 않는다
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "브랜치 $BRANCH 가 이미 있습니다 — 종료"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add public/data/simmons-market.json
          SUFFIX=""
          if [ "$PROV" = "true" ]; then SUFFIX=" (잠정치)"; fi
          git commit \
            -m "국내 실적 데이터: ${YEAR}년 추가${SUFFIX}" \
            -m "자동 감지 결과다. 시몬스는 비상장사라 공시가 아니라 기사를 근거로 한다." \
            -m "수치와 출처를 사람이 확인한 뒤 merge 할 것." \
            -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "[검수 필요] ${YEAR}년 국내 실적 자동 감지${SUFFIX}" \
            --body-file "$BODY" \
            --label "검수 필요" || \
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "[검수 필요] ${YEAR}년 국내 실적 자동 감지${SUFFIX}" \
            --body-file "$BODY"

      - name: 변경 없음
        if: steps.check.outputs.changed != 'true'
        run: echo "새 연도 실적을 찾지 못했습니다. 내일 다시 확인합니다."
