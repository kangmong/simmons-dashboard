name: 시몬스 재무제표 수집 (DART · 연 1회)

# Open DART 에서 시몬스 감사보고서를 받아 재무상태표·손익계산서를 뽑고
# public/data/simmons-financials.json 으로 커밋한다.
# 화면('시몬스 최근 실적 추이' 카드)은 이 파일만 읽는다.
#
# ★ 시몬스는 비상장사라 사업보고서가 없고 감사보고서만 낸다. 그래서 1년에 한 번,
#   감사보고서가 올라오는 3~4월 뒤에만 돌리면 된다(최근 접수일: 2026-03-30,
#   2025-03-24, 2024-04-01). 4월·5월 두 번 잡아 두어 접수가 늦어져도 받아 온다.
#   같은 해에 두 번 돌아도 내용이 같으면 커밋이 생기지 않는다.
# ★★ 실패하면 기존 JSON 을 그대로 둔다(수집기가 --force 없이는 덮어쓰지 않는다).
#   키가 없거나 DART 가 죽어 있어도 배포된 화면의 숫자가 사라지지 않는다.
#
# 준비물: 저장소 Secrets 에 DART_API_KEY 등록
#   (Settings → Secrets and variables → Actions → New repository secret)
on:
  schedule:
    - cron: '0 18 10 4,5 *'    # UTC 4/10·5/10 18:00 = KST 4/11·5/11 03:00
  workflow_dispatch:
    inputs:
      years:
        description: '추이 그래프용으로 훑을 감사보고서 수 (비우면 5)'
        required: false
      force:
        description: '실패해도 결과를 덮어쓴다 (보통 비워 둠)'
        type: boolean
        default: false

permissions:
  contents: write            # 결과 JSON 커밋용

concurrency:
  group: collect-dart-financials
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 시몬스 재무제표 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          # ★ 값을 준 것만 넘긴다 — 일정 실행(inputs 가 빈 값)에 기본값을 박으면
          #   수집기 기본값을 덮어쓴다(collect-kipris 에서 같은 실수를 겪었다).
          ARGS=""
          if [ -n "${{ inputs.years }}" ]; then
            ARGS="$ARGS --years ${{ inputs.years }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "실행: python dart_financials.py $ARGS"
          python dart_financials.py $ARGS

      - name: 변경 있을 때만 커밋·푸시
        if: always()
        run: |
          if git diff --quiet -- public/data/simmons-financials.json; then
            echo "변경 없음 → 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/simmons-financials.json
          git commit -m "자동 수집: 시몬스 재무제표 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
          git push

      - name: 결과 요약
        if: always()
        run: |
          python - <<'PY'
          import io, json, os
          p = "public/data/simmons-financials.json"
          if not os.path.isfile(p):
              print("::warning::simmons-financials.json 이 없습니다"); raise SystemExit(0)
          d = json.load(io.open(p, encoding="utf-8"))
          ok = d.get("status") == "ok"
          cur = (d.get("current") or {}).get("year")
          pre = (d.get("previous") or {}).get("year")
          txt = ["## %s 시몬스 재무제표 (DART)" % ("✅" if ok else "⚠️"), "",
                 "- 상태: `%s`" % d.get("status"),
                 "- 보고서: %s (접수 %s)" % (d.get("reportName"), d.get("receiptDate")),
                 "- 비교 기간: %s vs %s · 단위 %s" % (cur, pre, d.get("unit")),
                 "- 추이 연도: %s" % ", ".join(str(h["year"]) for h in (d.get("history") or []))]
          ac = d.get("accounts") or {}
          if ac:
              txt += ["", "| 계정 | 당기 | 전기 |", "|---|---:|---:|"]
              for k, v in ac.items():
                  txt.append("| %s | %s | %s |" % (v.get("label", k), v.get("current"), v.get("previous")))
          if not ok:
              txt.append("- 이유: %s" % d.get("reason"))
              print("::warning::DART 수집 실패 — %s" % d.get("reason"))
          for w in (d.get("warnings") or []):
              txt.append("- ⚠️ %s" % w)
              print("::warning::%s" % w)
          print("\n".join(txt))
          s = os.environ.get("GITHUB_STEP_SUMMARY")
          if s:
              io.open(s, "a", encoding="utf-8").write("\n".join(txt) + "\n")
          PY
