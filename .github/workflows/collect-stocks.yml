name: 경쟁사 주가 수집 (하루 1회)

# Yahoo Finance chart API 로 경쟁사·관련 상장사 시세를 받아
# public/data/stock-quotes.json 으로 커밋한다. 화면은 이 파일만 읽는다.
#
# ★ 키가 필요 없다(무키 엔드포인트). 대신 비공식 API 라 보장된 한도가 없으니
#   하루 1회만 돌린다. 종목당 요청 3회(1일·1주·1년) + 뉴스 1회.
# ★★ 심볼은 stocks_taxonomy.json 에서 읽는다. 종목 추가/변경은 그 파일만 고친다.
# ★★★ 수집 실패가 배포된 정상 데이터를 덮지 않는다(_existing_ok 방어).
#   일부 종목만 실패하면 나머지는 저장하고, 그 종목만 화면에서 사유를 보여 준다.
on:
  schedule:
    - cron: '10 7 * * 1-5'    # UTC 07:10 = KST 16:10 (한국 장 마감 후)
  workflow_dispatch:
    inputs:
      no_news:
        description: 'true 면 종목별 뉴스 수집을 생략'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-stocks
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 주가 수집
        run: |
          # ★ 값을 준 입력만 넘긴다(기본값을 하드코딩하면 일정 실행마다 설정을 덮는다).
          ARGS=""
          if [ "${{ inputs.no_news }}" = "true" ]; then
            ARGS="$ARGS --no-news"
          fi
          echo "실행: python stock_quotes.py $ARGS"
          python stock_quotes.py $ARGS

      - name: 변경 있을 때만 커밋·푸시
        if: always()
        run: |
          if git diff --quiet -- public/data/stock-quotes.json; then
            echo "변경 없음 → 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stock-quotes.json
          git commit -m "자동 수집: 경쟁사 주가 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
          git push

      - name: 결과 요약
        if: always()
        run: |
          python - <<'PY'
          import io, json, os
          p = "public/data/stock-quotes.json"
          if not os.path.isfile(p):
              print("::warning::stock-quotes.json 이 없습니다"); raise SystemExit(0)
          d = json.load(io.open(p, encoding="utf-8"))
          c = d.get("counts") or {}
          ok = d.get("status") == "ok"
          txt = ["## %s 경쟁사 주가" % ("✅" if ok and not c.get("failed") else "⚠️"), "",
                 "- 상태: `%s` · 생성 %s" % (d.get("status"), d.get("generatedAt")),
                 "- 종목: 전체 %s · 정상 %s · 실패 %s · 비상장 %s"
                 % (c.get("total"), c.get("ok"), c.get("failed"), c.get("unlisted"))]
          for i in d.get("items") or []:
              if i.get("status") == "ok":
                  txt.append("  - %s `%s` %s %s (%+.2f%%)%s"
                             % (i["name"], i["symbol"], i["now"], i.get("currency") or "",
                                i.get("changePct") or 0,
                                " ⚠️검증경고" if i.get("quoteWarning") else ""))
              elif i.get("status") == "unlisted":
                  txt.append("  - %s 비상장" % i["name"])
              else:
                  txt.append("  - ⚠️ %s `%s` 실패: %s"
                             % (i["name"], i.get("symbol"), i.get("reason")))
                  print("::warning::%s 시세 실패 — %s" % (i["name"], i.get("reason")))
          if not ok:
              txt.append("- 이유: %s" % d.get("reason"))
              print("::warning::주가 수집 실패 — %s" % d.get("reason"))
          # 등락률 교차검증 경고가 있으면 눈에 띄게 남긴다
          warns = [i for i in (d.get("items") or []) if i.get("quoteWarning")]
          if warns:
              txt.append("")
              txt.append("### ⚠️ 등락률 교차검증 불일치")
              for w in warns:
                  txt.append("- %s: %s" % (w["name"], w["quoteWarning"]))
          print("\n".join(txt))
          s = os.environ.get("GITHUB_STEP_SUMMARY")
          if s:
              io.open(s, "a", encoding="utf-8").write("\n".join(txt) + "\n")
          PY
