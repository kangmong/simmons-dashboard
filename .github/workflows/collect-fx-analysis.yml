name: 환율 해석 수집 (하루 1회)

# 환율 시세(Frankfurter) + 거시지표 + 뉴스 RSS 를 모아 Google Gemini 로 해석을
# 만들고 public/data/fx-analysis.json 으로 커밋한다.
# 화면은 이 파일만 읽는다(브라우저에서 Gemini 호출 0회 — 키가 내려가지 않는다).
#
# ★ 거시지표는 BLS(CPI·실업률) · 뉴욕 연은(EFFR) · 미 재무부(국채) · ICE DXY
#   산식(Frankfurter 환율로 계산)을 쓴다. 전부 무키다.
#   FRED 를 주 소스에서 뺀 이유: 이 러너에서 fredgraph.csv 가 100% 읽기
#   타임아웃으로 막혀 4개 지표가 매번 실패했다(로컬은 0.9초에 성공).
#   IP 대역 차단으로 보인다. FRED 는 보조 경로로만 남겼다.
#
# ★ Gemini 무료 티어 한도를 아끼려고 하루 1회만 돌린다. 한 번 실행에 모델
#   호출은 1회다(실패 시에만 다음 후보 모델로 재시도).
# ★★ 키가 없거나 해석이 실패해도 빌드가 깨지지 않는다. 시세·거시·뉴스는 그대로
#   저장되고, 화면의 '환율 해석' 블록만 이유를 띄운다.
# ★★★ 수집 실패가 배포된 데이터를 지우지 않는다(수집기의 _existing_ok 방어).
#   해석만 실패하면 이전 해석을 '이전 분석 유지' 표시와 함께 살려 둔다.
on:
  schedule:
    - cron: '40 21 * * *'    # UTC 21:40 = KST 06:40 (ECB 고시·미 장 마감 이후)
  workflow_dispatch:
    inputs:
      model:
        description: 'Gemini 모델 직접 지정 (비우면 models.list 로 자동 선택)'
        required: false
      no_ai:
        description: 'true 면 Gemini 호출 없이 시세·거시·뉴스만 수집'
        required: false
        type: boolean
        default: false

permissions:
  contents: write            # 결과 JSON 커밋용

concurrency:
  group: collect-fx-analysis
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 환율 해석 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # ★ 값을 준 것만 넘긴다. 기본값을 하드코딩하면 일정 실행(inputs 가 빈
          #   값)마다 그 기본값이 설정을 덮어쓴다 — KIPRIS 워크플로에서 실제로
          #   --years 3 이 20년치를 3년치로 줄인 적이 있다. 같은 실수를 반복하지 않는다.
          ARGS=""
          if [ -n "${{ inputs.model }}" ]; then
            ARGS="$ARGS --model ${{ inputs.model }}"
          fi
          if [ "${{ inputs.no_ai }}" = "true" ]; then
            ARGS="$ARGS --no-ai"
          fi
          echo "실행: python fx_analysis.py $ARGS"
          python fx_analysis.py $ARGS

      - name: 변경 있을 때만 커밋·푸시
        if: always()
        run: |
          if git diff --quiet -- public/data/fx-analysis.json; then
            echo "변경 없음 → 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fx-analysis.json
          git commit -m "자동 수집: 환율 해석 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
          git push

      - name: 결과 요약
        if: always()
        run: |
          python - <<'PY'
          import io, json, os
          p = "public/data/fx-analysis.json"
          if not os.path.isfile(p):
              print("::warning::fx-analysis.json 이 없습니다"); raise SystemExit(0)
          d = json.load(io.open(p, encoding="utf-8"))
          an = d.get("analysis") or {}
          ok = d.get("status") == "ok"
          aok = an.get("status") == "ok"
          txt = ["## %s 환율 해석" % ("✅" if ok and aok else "⚠️"), "",
                 "- 수집 상태: `%s` · 생성 %s" % (d.get("status"), d.get("generatedAt")),
                 "- 기준일: %s" % d.get("asOf")]
          for c in d.get("cards") or []:
              if c.get("status") == "ok":
                  txt.append("  - %s %s원 (%+.2f, %+.2f%%) %s"
                             % (c["cur"], c["now"], c.get("change") or 0,
                                c.get("changePct") or 0,
                                " ".join(b["text"] for b in c.get("badges") or [])))
          txt.append("- 거시지표: %d개 (실패 %d개)"
                     % (len((d.get("macro") or {}).get("items") or []),
                        len((d.get("macro") or {}).get("errors") or [])))
          txt.append("- 뉴스: %d건" % len((d.get("news") or {}).get("items") or []))
          if aok:
              nlink = sum(1 for k in ("upsideLimiters", "downsideSupports")
                          for f in an.get(k) or [] if f.get("sourceUrl"))
              ntot = sum(len(an.get(k) or []) for k in ("upsideLimiters", "downsideSupports"))
              txt.append("- 해석: `%s` · 전망 **%s**(확신 %s) · 요인 %d개 중 %d개 출처 링크"
                         % (an.get("model"), an["outlook"]["direction"],
                            an["outlook"]["confidence"], ntot, nlink))
              if an.get("stale"):
                  txt.append("- ⚠️ 이전 해석 유지: %s" % an.get("staleReason"))
                  print("::warning::해석 생성 실패 — 이전 분석 유지: %s" % an.get("staleReason"))
          else:
              txt.append("- 해석 실패: %s" % an.get("reason"))
              print("::warning::Gemini 해석 실패 — %s" % an.get("reason"))
              for e in (an.get("errors") or [])[:5]:
                  txt.append("  - `%s`: %s" % (e.get("model"), e.get("error")))
          print("\n".join(txt))
          s = os.environ.get("GITHUB_STEP_SUMMARY")
          if s:
              io.open(s, "a", encoding="utf-8").write("\n".join(txt) + "\n")
          PY
