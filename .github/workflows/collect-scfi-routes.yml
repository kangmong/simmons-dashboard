name: SCFI 항로별 운임 수집 (주 1회)

# SSE 가 금요일 발표한 SCFI 항로별 운임을 RackingHub 가 월요일에 정리해 싣는다.
# 그 뒤 월·화 18:00(KST)에 읽는다(바뀐 값이 없으면 커밋하지 않는다). 요청은 실행마다 1번.
# 종합지수 긴 흐름(2014년~)은 collect-freight(NLIC)가 따로 받는다.
on:
  schedule:
    - cron: '0 9 * * 1,2'     # UTC 월·화 09:00 = KST 월·화 18:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-scfi-routes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 실패하면 기존 파일을 그대로 둔다(scfi_routes.py 머리말 참고)
      - name: SCFI 항로별 수집
        run: python scfi_routes.py

      - name: 변경 있을 때만 커밋·푸시
        if: always()
        run: |
          if git diff --quiet -- public/data/scfi-routes.json; then
            echo "변경 없음 → 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/scfi-routes.json
          git commit -m "자동 수집: SCFI 항로별 운임 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          git pull --rebase -q
          git push
