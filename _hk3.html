<!doctype html><html><head><meta charset=utf-8></head><body>
<iframe id=f src="http://localhost:5000/index.html#material" style="width:1300px;height:1100px;border:0"></iframe>
<script>const f=document.getElementById('f');f.addEventListener('load',()=>{setTimeout(async()=>{const d=f.contentDocument;
 d.getElementById('updateBtn').click();
 await new Promise(r=>setTimeout(r,22000));
 const note=(d.querySelector('#materialCards .mt-fxrate')||{}).textContent||'(none)';
 const card=(d.querySelector('#materialCards .mt-card')||{}).textContent||'(none)';
 const upd=(d.getElementById('lastUpdated')||{}).textContent||'';
 document.title='lastUpdated=['+upd+'] rate=['+note+'] firstCard=['+card.replace(/\s+/g,' ').trim()+']';
},2500);});</script></body></html>
